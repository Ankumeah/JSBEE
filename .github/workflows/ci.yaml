name: go-tests

on: [ push, pull_request ]

jobs:
  go-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ "1.27.0" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: "**/go.mod"

      - name: Set CI env
        run: echo 'CI=true' >> $GITHUB_ENV

      - name: Run ci
        run: ./.ci.sh -tags=sqlite,init
