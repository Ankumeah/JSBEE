[build.environment]
  FRONTEND_SAVE_DIR="../public"
  GO_VERSION = "1.27.0"

[build]
  command = """
    (
      cd backend/internal/objectstore/netlifyblob/scripts &&
      bun install &&
    ) &&
    cd backend &&
    go tool templ generate ./internal/frontend/ &&
    go build -tags=sqlite,turso,init,netlifyblob -o /tmp/jsbee-init ./cmd/init &&
    /tmp/jsbee-init &&
    go build -tags=sqlite,turso,netlifyblob -o ../netlify/functions/api ./cmd/serverless
  """
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/internal/objectstore/netlifyblob/scripts/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/not_found.html"
  status = 404
